<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job</title>
</head>
<body>
<button id="openTab">job</button>

<script>
  document.getElementById('openTab').addEventListener('click', () => {
    const targetUrl = "https://www.google.com/goto?url=CAEScAHrOzAVRgxOqlbSmS88ho-QMmr_pq8MppMo6KKub6tyRjaTLhclfCnRGh1Unn6-y8aUeG6a-IyDFxUrNoynj5N8U7HE-lirmLVi6NRnlR4LNZTO09wcoBkCE9q-S7nEH1pEhwu_T_EiMenT9JQdeYI";

    const newTab = window.open('about:blank', '_blank');

    if (newTab) {
      newTab.document.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <title>get a life</title>
            <style>
              body, html {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                overflow: hidden;
              }
              iframe {
                border: none;
                width: 100%;
                height: 100%;
              }
            </style>
          </head>
          <body>
            <iframe src="${targetUrl}" title="get a life"></iframe>
          </body>
        </html>
      `);
      newTab.document.close();
    } else {
      alert("Pop-up blocked! Please allow pop-ups for this site.");
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('openTab');
    if (btn) {
      btn.click();
      window.location.href = 'https://www.google.com';
    }
  });
</script>
</body>
</html>
